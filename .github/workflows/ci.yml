name: Build Desktop & iOS

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-macos:
    name: Build macOS ZIP
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install desktop deps
        run: cd desktop && npm install

      - name: Build macOS ZIP
        run: cd desktop && npx electron-builder --mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: AURA-V1-macOS
          path: desktop/dist/*.zip

  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install root deps
        run: npm install

      - name: Sync iOS
        run: npx cap sync ios

      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods
          cd ios/App && pod install

      - name: Build IPA (unsigned, sideload-ready)
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $PWD/build/App.xcarchive \
            clean archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            EXPANDED_CODE_SIGN_IDENTITY=""

          mkdir -p build/ipa/Payload
          cp -R build/App.xcarchive/Products/Applications/App.app build/ipa/Payload/
          cd build/ipa
          zip -qr AURA-V1.ipa Payload
          echo "IPA built at ios/App/build/ipa/AURA-V1.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AURA-V1-iOS
          path: ios/App/build/ipa/AURA-V1.ipa
