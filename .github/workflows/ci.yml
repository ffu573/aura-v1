name: Build Desktop & iOSon:  push:    branches: [ main, master ]  workflow_dispatch:jobs:  build-macos:    name: Build macOS ZIP    runs-on: macos-latest    steps:      - name: Checkout        uses: actions/checkout@v4      - name: Setup Node        uses: actions/setup-node@v4        with:          node-version: '20'      - name: Install desktop deps        run: cd desktop && npm install      - name: Build macOS ZIP        run: cd desktop && npx electron-builder --mac        env:          CSC_IDENTITY_AUTO_DISCOVERY: "false"      - name: Upload ZIP        uses: actions/upload-artifact@v4        with:          name: AURA-V1-macOS          path: desktop/dist/*.zip  build-ios:    name: Build iOS IPA
